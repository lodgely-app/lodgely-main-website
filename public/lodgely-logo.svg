<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b233a" />
      <stop offset="100%" stop-color="#121829" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6fe7c2" />
      <stop offset="100%" stop-color="#5fd3b0" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fd3b0" />
      <stop offset="100%" stop-color="#38b28f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#5fd3b0" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="512" height="512" rx="140" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="6" y="6" width="500" height="500" rx="134" fill="none" stroke="#6fe7c2" stroke-opacity="0.12" stroke-width="6" />

  <!-- Roof Gable / Chevron -->
  <path
    d="M 256 94 L 406 206 L 356 206 L 256 132 L 156 206 L 106 206 Z"
    fill="url(#roofGrad)"
    filter="url(#glow)"
  />

  <!-- Center Pin / Teardrop Key -->
  <path
    d="M 256 182 C 204 182 172 222 172 274 C 172 328 228 386 256 422 C 284 386 340 328 340 274 C 340 222 308 182 256 182 Z"
    fill="url(#pinGrad)"
    filter="url(#glow)"
  />

  <!-- Keyhole Cutout in Center -->
  <circle cx="256" cy="256" r="17" fill="#1b233a" />
  <polygon points="250,256 262,256 264,302 248,302" fill="#1b233a" />
</svg>